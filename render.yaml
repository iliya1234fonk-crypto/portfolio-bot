services:
  - type: web
    name: portfolio-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
